<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Conta</title>
    <link rel="stylesheet" href="style/inserir-token.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="img/icone-logo.png" type="image/x-icon">
</head>
<body>
    <header>
        <a href="login.html"><i class="bi-arrow-left-circle-fill"></i></a>
    </header>
    <main>
        <div class="box">
            <img src="img/logo.png" alt="Logo Explora+" width="Logo Explora+">
            <h1>Confirmar Conta</h1>
            <p id="caixaEmail" style="margin-bottom: 20px; font-weight: bold;"></p>
            
            <form action="#" method="post">
                <div class="caixa-cod">
                    <input type="text" id="cod1" name="cod1" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="text" id="cod2" name="cod2" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="text" id="cod3" name="cod3" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="text" id="cod4" name="cod4" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="text" id="cod5" name="cod5" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="text" id="cod6" name="cod6" maxlength="1" inputmode="numeric" pattern="[0-9]">
                </div>
                
                <button type="button" id="reenviar_codigo" class="reenviar-codigo">Reenviar código</button>
                <button type="button" id="confirmar_conta" class="btn-preferencia">Confirmar Conta</button>
            </form>
        </div>
    </main>  
    <script src="/javascript/verificar_conta.js"></script>
</body>
</html>
