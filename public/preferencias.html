<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/preferencias.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Prêferencias</title>
    <link rel="stylesheet" href="style/footer.css">
    <link rel="shortcut icon" href="img/icone-logo.png" type="image/x-icon">
</head>

<body>
    <header>
        <a href="cadastro.html"><i class="bi-arrow-left-circle-fill"></i></a>
        <img src="img/logo.png" alt="Logo Explora+">
    </header>
    <main>
        <div class="box">
            <h1>Selecione seus gostos</h1>
            <form action="#" method="post">
                <div id="input-label-local">
                <div class="barra_input">
                    <img src="img/icone-logo.png" alt="">
                    <select name="local" id="local" required>
                        <option value="" selected disabled>Selecione seu local</option>
                        <option value="acre">Acre</option>
                        <option value="alagoas">Alagoas</option>
                        <option value="amapa">Amapá</option>
                        <option value="amazonas">Amazonas</option>
                        <option value="bahia">Bahia</option>
                        <option value="ceara">Ceará</option>
                        <option value="distrito-federal">Distrito Federal</option>
                        <option value="espirito-santo">Espírito Santo</option>
                        <option value="goias">Goiás</option>
                        <option value="maranhao">Maranhão</option>
                        <option value="mato-grosso">Mato Grosso</option>
                        <option value="mato-grosso-do-sul">Mato Grosso do Sul</option>
                        <option value="minas-gerais">Minas Gerais</option>
                        <option value="para">Pará</option>
                        <option value="paraiba">Paraíba</option>
                        <option value="parana">Paraná</option>
                        <option value="pernambuco">Pernambuco</option>
                        <option value="piaui">Piauí</option>
                        <option value="rio-de-janeiro">Rio de Janeiro</option>
                        <option value="rio-grande-do-norte">Rio Grande do Norte</option>
                        <option value="rio-grande-do-sul">Rio Grande do Sul</option>
                        <option value="rondonia">Rondônia</option>
                        <option value="roraima">Roraima</option>
                        <option value="santa-catarina">Santa Catarina</option>
                        <option value="sao-paulo">São Paulo</option>
                        <option value="sergipe">Sergipe</option>
                        <option value="tocantins">Tocantins</option>
                    </select>
                </div>
                    <label for="preco" id="labelLocal">Selecione seu local</label>
                </div>
                <div id="input-label-preco">
                <div class="barra_input">
                    <span class="material-symbols-outlined">attach_money</span>
                    <input type="number" name="preco" id="preco" placeholder="Orçamento Disponível" min="0">
                </div>
                    <label for="preco" id="labelPreco">Campo vazio</label>
                </div>

                <div id="input-label-dataNascimento">
                <div class="barra_input">
                    <span class="material-symbols-outlined">calendar_month</span>
                    <div>
                        <input type="number" class="data-nascimento" placeholder="Dia" name="data-nascimento" min="1" max="31" id="dia"  >/
                        <input type="number" class="data-nascimento" placeholder="Mês" name="data-nascimento" min="1" max="12" id="mes" >/
                        <input type="number" class="data-nascimento" placeholder="Ano" name="data-nascimento" min="1900" id="ano" >
                    </div>
                </div>
                    <label for="data-nascimento" id="labelDataNascimento">Data de Nascimento</label>
                </div>

                <button class="aplicar-preferencias">Adicionar Preferências<i class="bi bi-sliders"></i></button>
                <button class="btn-finalizar">Finalizar Cadastro</button>
            </form>
            <dialog class="modal">
                <h1>Selecione suas prefêrencias</h1>
                <form class="preferencias">

                    <div class="label-preferencias">
                        <!-- Preenchido dinamicamente pelo preferencias.js a partir de /api/categorias -->
                    </div>
                    <hr>
                    <button class="aplicar">Aplicar</button>

                </form>
            </dialog>
    </main>
    <footer>
        <div class="coluna-footer coluna-explora">
            <h2>Explora+</h2>
            <p>Descubra os melhores eventos da sua cidade e planeje viagens inesquecíveis.</p>
        </div>

        <div class="coluna-footer coluna-redes-sociais">
            <h2>Redes Sociais</h2>
            <div class="links-redes">
                <a href="" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
                <a href="" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
                <a href="mailto:exploramais.eventos@gmail.com" aria-label="E-mail"><i class="bi bi-envelope-fill"></i></a>
            </div>
        </div>
    </footer>
    <script src="/javascript/preferencias.js"></script>
    <script src="/javascript/banner-cookies.js"></script>
</body>

</html>
