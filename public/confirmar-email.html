<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar E-mail</title>
    <link rel="stylesheet" href="style/inserir-token.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="img/icone-logo.png" type="image/x-icon">
</head>
<body>
    <header>
        <a href="cadastro.html"><i class="bi-arrow-left-circle-fill"></i></a>
    </header>
    <main>
        <div class="box">
            <img src="img/logo.png" alt="" width="Logo Explora+">
            <h1>Confirme seu e-mail</h1>
            <p style="text-align:center;font-size:14px;">
                Enviamos um código de 6 dígitos para o seu e-mail. Ele expira em 24 horas.
            </p>
            <form action="#" method="post">
                <div class="caixa-cod">
                    <input type="text" id="cod1" name="cod1" maxlength="1" inputmode="numeric">
                    <input type="text" id="cod2" name="cod2" maxlength="1" inputmode="numeric">
                    <input type="text" id="cod3" name="cod3" maxlength="1" inputmode="numeric">
                    <input type="text" id="cod4" name="cod4" maxlength="1" inputmode="numeric">
                    <input type="text" id="cod5" name="cod5" maxlength="1" inputmode="numeric">
                    <input type="text" id="cod6" name="cod6" maxlength="1" inputmode="numeric">
                </div>
                <p id="alerta-erro" style="display:none;color:red;font-size:14px;"></p>
                <button type="button" id="btn-reenviar-codigo" class="reenviar-codigo">
                    Reenviar código
                </button>
                <button type="button" id="btn-confirmar-codigo" class="btn-preferencia">Confirmar e-mail</button>
            </form>
        </div>
    </main>
    <script src="/javascript/confirmar-email.js"></script>
    <script src="/javascript/banner-cookies.js"></script>
</body>
</html>
