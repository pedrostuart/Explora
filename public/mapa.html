<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa</title>
    <link rel="stylesheet" href="style/header.css">
    <link rel="stylesheet" href="style/footer.css">
    <link rel="stylesheet" href="style/mapa.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="shortcut icon" href="img/icone-logo.png" type="image/x-icon">
</head>
<body>
    <section class="barra-lateral-header">
        
        <nav>
            <div class="fechar-logo">
                <img src="img/logo.png" alt="Logo Site">
                <button class="fechar-menu"><i class="bi bi-x"></i></button>
            </div>
            
            <ul>
                <li> <a href="index.html"><i class="bi bi-house-fill"></i> Início</a></li>
                <li> <a href="eventos.html"><i class="bi bi-calendar-event-fill"></i> Eventos</a></li>
                <li> <a href="mapa.html"><i class="bi bi-map-fill"></i> Mapa</a></li>
                <li> <a href="favoritos_eventos.html"><i class="bi bi-heart-fill"></i> Favoritos</a></li>
            </ul>
            <div class="botoes_cadastro">
                <a href="login.html" id="entrar">Entrar</a>
                <a href="cadastro.html" id="cadastrar">Cadastre-se</a>
            </div>  
        </nav>
        
    </section>
    
    <header>
        <nav>
        <div class="menu-logo">
            <button class="hamburguer"><i class="bi bi-list"></i></button>
            <a href="index.html"><img src="img/logo.png" alt="Logo Site"></a>
        </div>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="eventos.html">Eventos</a></li>
            <li><a href="mapa.html">Mapa</a></li>
            <li><a href="favoritos_eventos.html">Favoritos</a></li>
        </ul>
        <div class="botoes_cadastro">

            <a id="entrar" href="login.html">Entrar</a>
            <a id="cadastrar" href="cadastro.html">Cadastre-se</a>
        </div>
        </nav>
        
    </header>
    <main>
        <section class="menu-lateral">
            <div class="fechar-link">
                <a href="eventos.html"><span class="material-symbols-outlined">map_search</span>Visualizar Eventos</a>
                <button class="fechar-menu"><i class="bi bi-x"></i></button>
            </div>

            <div class="filtrar-distancia">
                <h2>Distância do mapa</h2>
                <div>
                    <input type="radio" id="5km" name="distancia" class="radio" value="17">
                    <label for="5km"> Até 5km de distância</label>
                </div>

                <div>
                    <input type="radio" id="10km" name="distancia" class="radio" value="16">
                    <label for="10km"> Até 10km de distância</label>
                </div>

                <div>
                    <input type="radio" id="20km" name="distancia" class="radio" value="15">
                    <label for="20km"> Até 20km de distância</label>
                </div>

                <div>
                    <input type="radio" id="30km" name="distancia" class="radio" value="14">
                    <label for="30km"> Até 30km de distância</label>
                </div>

                <div>
                    <input type="radio" id="+50km" name="distancia" class="radio" value="13">
                    <label for="+50km"> Mais de 30km de distância</label>
                </div>
            </div>
        </section>
        <section class="mapa">
            
                <iframe src="https://www.google.com/maps?q=eventos&z=17&output=embed" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade">
                </iframe>
                <button class="btn-preferencia-resposivo">Filtrar<i class="bi bi-funnel-fill"></i></button>
                <div class="barra_pesquisa">
                    <input type="text"  placeholder="Buscar eventos, locais..." class="input-pesquisa">
                
                    <button class="btn_pesquisar">
                        <i class="bi bi-search"></i>
                        Pesquisar
                    </button>
                </div>
                
        </section>
    </main>
    <footer>
        <div class="coluna-footer coluna-explora">
            <h2>Explora+</h2>
            <p>Descubra os melhores eventos da sua cidade e planeje viagens inesquecíveis.</p>
        </div>

        <div class="coluna-footer coluna-redes-sociais">
            <h2>Redes Sociais</h2>
            <div class="links-redes">
                <a href="" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
                <a href="" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
                <a href="mailto:exploramais.eventos@gmail.com" aria-label="E-mail"><i class="bi bi-envelope-fill"></i></a>
            </div>
        </div>
    </footer>
    <script src="/javascript/menu.js"></script>
    <script src="/javascript/filtros-mapa.js"></script>
    <script src="/javascript/barra-pesquisa-mapa.js"></script>
    <script src="/javascript/banner-cookies.js"></script>
</body>
</html>
